import groovy.json.JsonSlurper

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

// The ML Kit features the app enables: `expoMlKit.features` in its
// gradle.properties (the config plugin's `features`), else the defaults,
// with the features each `requires`. `src/features.json` names each
// feature's artifacts; a feature's code (src/features/<name>/java) is
// compiled only when it is enabled, with the code it shares with others
// (src/shared/<shared>/java: the GenAI features' AICore calls), and
// `EnabledFeatures.kt`, generated here, lists the enabled ones for the module.
def mlKitCatalogue = new JsonSlurper().parse(file("$projectDir/../src/features.json"))
def mlKitCatalog = mlKitCatalogue.features
def mlKitAsked = (findProperty('expoMlKit.features')?.toString()
    ?: mlKitCatalog.findAll { it.value.default }.keySet().join(','))
  .split(',')*.trim().findAll { it }
def mlKitChosen = [] as Set
def mlKitAdd
mlKitAdd = { String name ->
  if (!mlKitCatalog.containsKey(name)) throw new GradleException("expo-ml-kit: no feature '$name'")
  if (mlKitChosen.add(name)) (mlKitCatalog[name].requires ?: []).each { mlKitAdd(it) }
}
mlKitAsked.each { mlKitAdd(it) }
def mlKitFeatures = mlKitCatalog.keySet().findAll { mlKitChosen.contains(it) }
def mlKitShared = mlKitFeatures.collect { mlKitCatalog[it].shared }.findAll { it }.unique()
def mlKitGenerated = file("$buildDir/generated/mlkit")
def mlKitRegistry = file("$mlKitGenerated/expo/modules/mlkit/EnabledFeatures.kt")
mlKitRegistry.parentFile.mkdirs()
mlKitRegistry.text = """package expo.modules.mlkit

/** Generated by build.gradle from `expoMlKit.features`. */
internal val ENABLED_FEATURES: List<MlKitFeature> = listOf(
${mlKitFeatures.collect { "  ${it.capitalize()}Feature," }.join('\n')}
)
"""

group = 'expo.modules.mlkit'
version = '0.1.0'

android {
  namespace "expo.modules.mlkit"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  // The instrumented tests (`pnpm test:android`): the repository's shared
  // fixtures and test support, neither of which ships.
  sourceSets {
    main {
      java.srcDirs += [mlKitGenerated] + mlKitFeatures.collect { "src/features/$it/java" } +
        mlKitShared.collect { "src/shared/$it/java" }
    }
    androidTest {
      assets.srcDirs += "$projectDir/../../../fixtures"
      java.srcDirs += "$projectDir/../../../test-support/android"
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  mlKitCatalogue.core.android.each { implementation it }
  mlKitFeatures.each { feature -> mlKitCatalog[feature].android.each { implementation it } }

  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  // expo-image-loader's, which decodes expo-image-manipulator's handles.
  androidTestImplementation 'com.github.bumptech.glide:glide:5.0.5'
}
