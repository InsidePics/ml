plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mlkit'
version = '0.1.0'

android {
  namespace "expo.modules.mlkit"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  // The instrumented tests (`pnpm test:android`): the repository's shared
  // fixtures and test support, neither of which ships.
  sourceSets {
    androidTest {
      assets.srcDirs += "$projectDir/../../../fixtures"
      java.srcDirs += "$projectDir/../../../test-support/android"
    }
  }
  lintOptions {
    abortOnError false
  }
}

// BUNDLED ML Kit artifacts only (the model ships in the APK), so a result
// names the model that produced it. Each line is pinned to `ML_KIT_ARTIFACTS`
// in src/artifacts.ts (the `mlKitArtifacts` test).
dependencies {
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
  implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
  implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
  implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
  implementation 'com.google.mlkit:image-labeling:17.0.9'
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'
  implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
  implementation 'com.google.mlkit:object-detection:17.0.2'
  implementation 'com.google.mlkit:entity-extraction:16.0.0-beta6'
  implementation 'com.google.mlkit:face-detection:16.1.7'

  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  // expo-image-loader's, which decodes expo-image-manipulator's handles.
  androidTestImplementation 'com.github.bumptech.glide:glide:5.0.5'
}
