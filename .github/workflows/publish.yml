# Publishes one package to npm when its tag is pushed:
#
#   git tag expo-ml-kit@0.2.0 <sha> && git push origin expo-ml-kit@0.2.0
#
# The tag names the directory under packages/ and the version in its
# package.json; the tagged commit must be on main and pass the gate. Device
# runs are required only for native code the release changes since the
# package's previous tag (all of it for a package's first tag):
# - packages/<dir>/android: the Android suites, run here on an emulator;
# - packages/<dir>/ios of expo-ml-kit or expo-apple-ml: a passing iPhone run
#   on the commit (`device/ios`, posted by `pnpm test:device:ios`; no cloud
#   runs ML Kit or Apple's models on an iPhone). expo-image-ml-tools' iOS
#   code is covered by the gate's macOS run.
# npm trusts this workflow (trusted publishing): no token, provenance attached.
name: Publish

on:
  push:
    tags: ['expo-*@*']

permissions:
  contents: read
  statuses: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.release.outputs.dir }}
      android: ${{ steps.release.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag, version, main, and the native code it changes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-check.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

  android:
    needs: check
    if: needs.check.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pnpm install --frozen-lockfile
      - name: Every package's instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ONLY="${{ needs.check.outputs.dir }}" pnpm test:android

  publish:
    needs: [check, android]
    if: always() && needs.check.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: brew install kotlin

      - run: pnpm install --frozen-lockfile
      - run: pnpm gate

      - name: Build and publish
        working-directory: packages/${{ needs.check.outputs.dir }}
        env:
          CI: 1
        run: |
          pnpm build
          npm install -g npm@latest
          npm publish
